appId: com.smartcs.desktop
productName: 智能客服
asar: true
asarUnpack: "**\\*.{node,dll}"
compression: maximum
files:
  - dist
  - node_modules
  - package.json
afterSign: ".erb/scripts/notarize.js"
win:
  requestedExecutionLevel: requireAdministrator
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 智能客服
  uninstallDisplayName: 智能客服
  deleteAppDataOnUninstall: true
  artifactName: "${productName} ${version}.${ext}"
directories:
  app: release/app
  buildResources: assets
  output: release/build
# 不含千牛 Strategy backend（体积大）；本版仅拼多多
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
      - "!backend/**"
afterPack: "./removeLocales.js"
